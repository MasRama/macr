name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # gnome-extensions (from gnome-shell) packs the zip.
      - name: Install gnome-extensions and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell shellcheck
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Check the settings schema
        run: glib-compile-schemas --strict --dry-run schemas
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tools/devshell/*.sh
      - name: Pack the extension
        run: npm run pack
