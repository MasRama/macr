name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  extension:
    name: Extension zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install gnome-extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell
      - run: npm ci
      - run: npm run pack
      - name: Check the packed version
        run: |
          unzip -p build/macr@masrama.github.io.shell-extension.zip metadata.json \
            | grep -q "\"version-name\": \"$VERSION\""
      - name: Write the checksums
        working-directory: build
        run: |
          sha256sum macr@masrama.github.io.shell-extension.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            build/macr@masrama.github.io.shell-extension.zip \
            build/SHA256SUMS
