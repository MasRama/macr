name: Bug report
description: Something in Macr does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Files
        2. Click the app name in the menu bar
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Macr version
      description: Shown in `gnome-extensions info macr@masrama.github.io`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and GNOME Shell version
      description: For example "Zorin OS 18, GNOME Shell 46.0". `gnome-shell --version` prints the second part.
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Other enabled extensions
      description: Output of `gnome-extensions list --enabled`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -b /usr/bin/gnome-shell | grep -i macr`"
      render: text
